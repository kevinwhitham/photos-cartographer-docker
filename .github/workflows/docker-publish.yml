name: Docker Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:   
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Latest Release of photos-cartographer
        env:
          # Use standard GITHUB_TOKEN for public repos; use a custom PAT for private repos
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          gh release download --repo "sigfridvonshrink/photos-cartographer" --pattern 'photos-cartographer'
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kevinwhitham/photos-cartographer-docker/photos-cartographer
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
